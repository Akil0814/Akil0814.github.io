<!doctype html>
<html lang="en" data-theme="dark" data-i18n-page="elysia-engine/index" data-i18n-base="..">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fff3f8" />
  <link rel="icon" type="image/png" sizes="128x128" href="../icon/elysia_128.png" />
  <link rel="icon" type="image/png" sizes="1024x1024" href="../icon/elysia_1024.png" />
  <link rel="apple-touch-icon" href="../icon/elysia_1024.png" />
  <title data-i18n="ElysiaEngine.title">Elysia Engine</title>
  <script>
    (function () {
      const LANGUAGE_MAP = { zh: "zh-CN", ja: "ja", en: "en" };
      const root = document.documentElement;

      try {
        const theme = localStorage.getItem("theme") === "light" ? "light" : "dark";
        const fxEnabled = (localStorage.getItem("fx") || "on") !== "off";
        const savedLanguage = localStorage.getItem("lang") || "en";
        const prismThemeHref = theme === "dark" ? "../assets/prism/prism-dark.css" : "../assets/prism/prism-light.css";
        const metaThemeColor = document.querySelector('meta[name="theme-color"]');
        const prismThemeLink = document.createElement("link");

        root.setAttribute("data-theme", theme);
        root.setAttribute("lang", LANGUAGE_MAP[savedLanguage] || "en");
        root.setAttribute("data-elysia-intro", fxEnabled ? "armed" : "skip");

        if (metaThemeColor) {
          metaThemeColor.setAttribute("content", theme === "dark" ? "#091934" : "#fff3f8");
        }

        prismThemeLink.id = "elysiaPrismThemeLink";
        prismThemeLink.rel = "stylesheet";
        prismThemeLink.href = prismThemeHref;
        document.head.appendChild(prismThemeLink);

        window.__elysiaIntroFailSafe = window.setTimeout(function () {
          if (root.getAttribute("data-elysia-intro") !== "done") {
            root.setAttribute("data-elysia-intro", "skip");
          }
        }, 5000);
      } catch (_) {
        root.setAttribute("data-theme", "dark");
        root.setAttribute("lang", "en");
        root.setAttribute("data-elysia-intro", "skip");
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=JetBrains+Mono:wght@400;600&family=Manrope:wght@400;500;700;800&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="./_shared/base.css?v=20260714a">
</head>
<body class="elysia-page">
  <div class="elysia-intro" id="elysiaIntro" aria-hidden="true">
    <div class="elysia-intro__backdrop"></div>
    <video
      class="elysia-intro__video"
      id="elysiaIntroVideo"
      muted
      autoplay
      playsinline
      preload="auto"
      aria-hidden="true"
    >
      <source src="./res/elysia_intro.mp4" type="video/mp4" />
    </video>
    <div class="elysia-intro__code-panel" id="elysiaIntroCodePanel" aria-hidden="true">
      <div class="elysia-intro__code-shell">
        <pre class="elysia-intro__code language-cpp"><code id="elysiaIntroCode"></code></pre>
      </div>
    </div>
  </div>

  <div class="elysia-aura elysia-aura--one" aria-hidden="true"></div>
  <div class="elysia-aura elysia-aura--two" aria-hidden="true"></div>
  <div class="elysia-stars" aria-hidden="true"></div>
  <canvas class="elysia-cosmos" id="elysiaCosmos" aria-hidden="true"></canvas>

  <header class="nav">
    <div class="nav__left">
      <a class="brand" href="../index.html" aria-label="Home">
        <span class="brand__dot"></span>
        <span class="brand__text">AKIL</span>
      </a>
    </div>

    <nav class="nav__right">
      <select id="langSelect" class="lang-select" aria-label="Language select" data-i18n="common.lang.select" data-i18n-attr="aria-label">
        <option value="zh" data-i18n="common.lang.zh">&#20013;&#25991;</option>
        <option value="ja" data-i18n="common.lang.ja">&#26085;&#26412;&#35486;</option>
        <option value="en" selected data-i18n="common.lang.en">English</option>
      </select>

      <button id="toggleFx" class="btn btn--ghost" type="button" data-i18n="common.controls.fx">FX</button>
      <button id="themeBtn" class="btn" type="button" data-i18n="common.controls.theme">Theme</button>
    </nav>
  </header>

  <main class="wrap elysia-shell">
    <section class="elysia-landing-hero">
      <div class="elysia-landing-hero__stage">
        <div class="elysia-landing-hero__copy">
          <div class="elysia-landing-hero__title-lockup">
            <span class="elysia-landing-hero__title-mark" aria-hidden="true">
              <img class="elysia-landing-hero__title-icon elysia-landing-hero__title-icon--light" src="../icon/elysia_128.png" alt="" />
              <img class="elysia-landing-hero__title-icon elysia-landing-hero__title-icon--dark" src="../icon/elysia_white_128.png" alt="" />
            </span>
            <h1 class="elysia-title elysia-landing-hero__title" data-i18n="ElysiaEngine.title">Elysia Engine</h1>
          </div>
        </div>
      </div>
      <a class="elysia-scroll-cue" href="#elysia-content" aria-label="Scroll to content skeleton">
        <span class="elysia-scroll-cue__line"></span>
        <span class="elysia-scroll-cue__label">Scroll</span>
      </a>
    </section>

    <section class="elysia-module-section" id="elysia-content">
      <div class="elysia-module-showcase">
        <div class="elysia-module-showcase__visual" aria-hidden="true">
          <div class="elysia-module-showcase__glow"></div>
          <div class="elysia-module-showcase__orb"></div>
          <img class="elysia-module-showcase__character" src="../image/elysia_stand.png" alt="" />
        </div>

        <div class="elysia-module-showcase__index">
          <header class="elysia-module-showcase__header">
            <p class="elysia-module-showcase__eyebrow" data-i18n="ElysiaEngine.modules.eyebrow">Engine Module Index</p>
            <h2 class="elysia-module-showcase__title" data-i18n="ElysiaEngine.modules.title">Engine Modules</h2>
          </header>

          <nav class="elysia-module-grid" aria-label="Engine modules" data-i18n="ElysiaEngine.modules.aria_label" data-i18n-attr="aria-label">
            <a class="elysia-module-card" href="./scene/">
              <span class="elysia-module-card__number">01</span>
              <span class="elysia-module-card__name" data-i18n="ElysiaEngine.modules.scene">Scene</span>
              <span class="elysia-module-card__arrow" aria-hidden="true">&nearr;</span>
            </a>

            <a class="elysia-module-card" href="./resources/">
              <span class="elysia-module-card__number">02</span>
              <span class="elysia-module-card__name" data-i18n="ElysiaEngine.modules.resources">Resource Loading</span>
              <span class="elysia-module-card__arrow" aria-hidden="true">&nearr;</span>
            </a>

            <a class="elysia-module-card" href="./input/">
              <span class="elysia-module-card__number">03</span>
              <span class="elysia-module-card__name" data-i18n="ElysiaEngine.modules.input">Input</span>
              <span class="elysia-module-card__arrow" aria-hidden="true">&nearr;</span>
            </a>

            <a class="elysia-module-card" href="./ui/">
              <span class="elysia-module-card__number">04</span>
              <span class="elysia-module-card__name" data-i18n="ElysiaEngine.modules.ui">UI</span>
              <span class="elysia-module-card__arrow" aria-hidden="true">&nearr;</span>
            </a>
          </nav>
        </div>
      </div>
    </section>

    <section class="elysia-bottom-banner">
      <div class="elysia-bottom-showcase">
        <img class="elysia-bottom-showcase__image" src="../image/elysia_bottom.jpg" alt="Elysia bottom artwork" />
      </div>
    </section>
  </main>

  <footer class="elysia-footer">
    <p>
      <span class="mono">&copy; <span id="year"></span> Akil</span>
      <span class="elysia-footer__dot">&middot;</span>
      <span data-i18n="ElysiaEngine.footer.page">Elysia Engine module index</span>
    </p>
  </footer>

  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/prism/prism.js"></script>
  <script src="./_shared/base.js?v=20260709a"></script>
  <script src="./_shared/cosmos.js?v=20260713c"></script>
  <script src="./index_intro.js?v=20260713b"></script>
</body>
</html>
