  <link rel="icon" type="image/png" sizes="128x128" href="../../../icon/Akil_icon_128.png" />
  <link rel="icon" type="image/png" sizes="1024x1024" href="../../../icon/Akil_icon_1024.png" />

  <title data-i18n="pathfinding_web.title">PathFindingVisualizer Web Demo</title>
  <script src="../../../js/prefs_bootstrap.js"></script>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="../../../css/base.css">

  <style>
    .demo-actions {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .demo-actions .btn {
      text-decoration: none;
    }

    .demo-stage {
      overflow: hidden;
      padding: 0;
    }

    .demo-stage__top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,0));
    }

    .demo-stage__title {
      margin: 0;
      font-size: 20px;
    }

    .demo-stage__status {
      flex-shrink: 0;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.04);
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      color: var(--text);
      white-space: nowrap;
    }

    .demo-stage__canvas-wrap {
      padding: 18px;
    }

    .demo-stage__canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 3 / 2;
      margin: 0 auto;
      border-radius: 16px;
      border: 1px solid var(--line);
      background:
        radial-gradient(circle at top, rgba(124,77,255,.10), transparent 32%),
        linear-gradient(180deg, rgba(8,12,24,.94), rgba(11,16,32,.98));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
      outline: none;
    }

    @media (max-width: 820px) {
      .demo-stage__top {
        flex-direction: column;
        align-items: flex-start;
      }

      .demo-stage__status {
        white-space: normal;
      }
    }
  </style>
</head>
<body>
  <header class="nav">
    <div class="nav__left">
      <a class="brand" href="../../../index.html" aria-label="Home">
        <span class="brand__dot"></span>
        <span class="brand__text">AKIL</span>
      </a>
    </div>

    <nav class="nav__right">
      <a href="../PathFindingVisualizer.html" data-i18n="pathfinding_web.nav.project_page">Project Page</a>
      <select id="langSelect" class="lang-select" aria-label="Language select" data-i18n="common.lang.select" data-i18n-attr="aria-label">
        <option value="zh" data-i18n="common.lang.zh">&#20013;&#25991;</option>
        <option value="ja" data-i18n="common.lang.ja">&#26085;&#26412;&#35486;</option>
        <option value="en" selected data-i18n="common.lang.en">English</option>
      </select>
      <button id="toggleFx" class="btn" type="button" title="Toggle visual effects" data-i18n="common.controls.fx">FX</button>
      <button id="themeBtn" class="btn" type="button" title="Toggle theme" data-i18n="common.controls.theme">Theme</button>
    </nav>
  </header>

  <main id="top" class="wrap">
    <section class="project-intro">
      <p class="project-intro__kicker" data-i18n="pathfinding_web.intro.kicker">C++ / WebAssembly / Pathfinding</p>
      <h1 class="project-intro__title" data-i18n="pathfinding_web.intro.title">PathFindingVisualizer Web Demo</h1>
      <div class="project-intro__chips">
        <span class="chip">C++</span>
        <span class="chip">WebAssembly</span>
        <span class="chip" data-i18n="pathfinding_web.intro.chips.visualizer">Visualizer</span>
        <span class="chip" data-i18n="pathfinding_web.intro.chips.algorithms">Algorithms</span>
      </div>
      <div class="demo-actions">
        <a class="btn btn--ghost" href="../PathFindingVisualizer.html" data-i18n="pathfinding_web.actions.project_page">Back to Project Page</a>
        <a class="btn btn--ghost" href="../../index.html" data-i18n="pathfinding_web.actions.more_projects">More Projects</a>
        <a class="btn btn--ghost" href="https://github.com/Akil0814/PathFindingVisualizer" target="_blank" rel="noreferrer" data-i18n="pathfinding_web.actions.source">Source Repo</a>
      </div>
    </section>

    <section class="section">
      <article class="panel demo-stage">
        <div class="demo-stage__top">
          <div>
            <h2 class="demo-stage__title" data-i18n="pathfinding_web.runtime.title">Live Demo</h2>
          </div>
          <div id="status" class="demo-stage__status" data-i18n="pathfinding_web.runtime.status.checking">Checking runtime...</div>
        </div>

        <div class="demo-stage__canvas-wrap">
          <canvas
            id="canvas"
            class="demo-stage__canvas"
            oncontextmenu="event.preventDefault()"
            tabindex="-1"
          ></canvas>
        </div>
      </article>
    </section>
  </main>

  <footer class="footer">
    <p><span class="mono">&copy; <span id="year"></span> Akil</span> <span class="dot">&middot;</span> <span class="mono" data-i18n="pathfinding_web.footer.page">PathFindingVisualizer Web Demo</span></p>
  </footer>

  <script src="../../../assets/js/i18n.js"></script>
  <script src="../../_shared/project_page.js?v=20260228"></script>
  <script>
    const statusElement = document.getElementById("status");
    const canvasElement = document.getElementById("canvas");
    const canvasAspectRatio = 3 / 2;
    const t = window.I18N?.t?.bind(window.I18N) ?? ((key, params, fallback) => fallback ?? key);

    const runtimeState = {
      mode: "checking",
      loadingLeft: 0,
    };

    function syncCanvasSize() {
      const bounds = canvasElement.getBoundingClientRect();
      const targetWidth = Math.max(1, Math.round(bounds.width));
      const targetHeight = Math.max(1, Math.round(targetWidth / canvasAspectRatio));

      if (canvasElement.width !== targetWidth) {
        canvasElement.width = targetWidth;
      }

      if (canvasElement.height !== targetHeight) {
        canvasElement.height = targetHeight;
      }
    }

    function renderRuntimeCopy() {
      if (runtimeState.mode === "missing") {
        statusElement.textContent = t("pathfinding_web.runtime.status.missing", undefined, "Build not found");
        return;
      }

      if (runtimeState.mode === "loading") {
        const loadingLabel = t("pathfinding_web.runtime.status.loading", undefined, "Loading demo");
        statusElement.textContent = runtimeState.loadingLeft > 0
          ? `${loadingLabel} (${runtimeState.loadingLeft})`
          : loadingLabel;
        return;
      }

      if (runtimeState.mode === "ready") {
        statusElement.textContent = t("pathfinding_web.runtime.status.ready", undefined, "Ready");
        return;
      }

      statusElement.textContent = t("pathfinding_web.runtime.status.checking", undefined, "Checking runtime...");
    }

    window.Module = {
      canvas: canvasElement,
      setStatus(text) {
        runtimeState.mode = text ? "loading" : "ready";
        runtimeState.loadingLeft = 0;
        statusElement.textContent = text || t("pathfinding_web.runtime.status.ready", undefined, "Ready");
      },
      monitorRunDependencies(left) {
        runtimeState.mode = left ? "loading" : "ready";
        runtimeState.loadingLeft = left || 0;
        renderRuntimeCopy();
      }
    };

    function showMissingRuntime() {
      runtimeState.mode = "missing";
      runtimeState.loadingLeft = 0;
      renderRuntimeCopy();
    }

    function loadRuntime() {
      const runtimeScript = document.createElement("script");
      runtimeScript.src = "./PathFindingVisualizer.js";
      runtimeScript.async = true;
      runtimeScript.onerror = showMissingRuntime;
      document.body.appendChild(runtimeScript);
    }

    ProjectPageCore.init({
      onLangChange() {
        window.setTimeout(renderRuntimeCopy, 0);
      }
    });

    syncCanvasSize();
    if (typeof ResizeObserver === "function") {
      new ResizeObserver(syncCanvasSize).observe(canvasElement);
    } else {
      window.addEventListener("resize", syncCanvasSize);
    }

    renderRuntimeCopy();
    loadRuntime();
  </script>
</body>
</html>
