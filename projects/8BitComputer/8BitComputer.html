  <script src="../../js/prefs_bootstrap.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/layout.css">

<body>
  <header class="nav">
    <div class="nav__left">
      <a class="brand" href="../../index.html">
        <span class="brand__dot"></span>
        <span class="brand__text">AKIL</span>
      </a>
    </div>

    <nav class="nav__right">
      <a href="../../index.html" data-i18n="common.nav.home">Home</a>
      <a href="#videos" data-i18n="common.nav.videos">Videos</a>
      <select id="langSelect" class="lang-select" aria-label="Language select" data-i18n="common.lang.select" data-i18n-attr="aria-label">
        <option value="zh" data-i18n="common.lang.zh">&#20013;&#25991;</option>
        <option value="ja" data-i18n="common.lang.ja">&#26085;&#26412;&#35486;</option>
        <option value="en" selected data-i18n="common.lang.en">English</option>
      </select>
      <button id="toggleFx" class="btn" type="button" title="Toggle visual effects" data-i18n="common.controls.fx">FX</button>
      <button id="themeBtn" class="btn" type="button" title="Toggle theme" data-i18n="common.controls.theme">Theme</button>
    </nav>
  </header>

  <main class="wrap">
    <section class="project-intro">
      <p class="project-intro__kicker" data-i18n="8BitComputer.intro.kicker">CPU Design / Digital Logic / 8-bit Architecture</p>
      <h1 class="project-intro__title" data-i18n="8BitComputer.intro.title">8Bit Computer Project Overview</h1>
      <p class="project-intro__desc" data-i18n="8BitComputer.intro.desc">
      </p>
      <div class="project-intro__chips">
        <span class="chip" data-i18n="8BitComputer.intro.chips.isa">8-bit ISA</span>
        <span class="chip" data-i18n="8BitComputer.intro.chips.registers">Registers</span>
        <span class="chip" data-i18n="8BitComputer.intro.chips.alu">ALU</span>
        <span class="chip" data-i18n="8BitComputer.intro.chips.control_unit">Control Unit</span>
      </div>
    </section>

    <section class="section">
      <div class="section__head">
        <h2 data-i18n="8BitComputer.sections.preview_image">Preview Image</h2>
      </div>
      <article class="theme-photo-card">
        <img
          src="/projects/8BitComputer/res/tmp_demo.png"
          alt="8BitComputer preview image"
          data-i18n="8BitComputer.preview.alt"
          data-i18n-attr="alt"
          loading="lazy"
        />
      </article>
    </section>


    <section class="section">
      <div class="section__head">
        <h2 data-i18n="common.sections.project_summary">Project Summary</h2>
      </div>
      <div class="panel">
        <p class="project-intro__desc" data-i18n="8BitComputer.summary.text">
        </p>
      </div>
    </section>

    <section class="section">
      <article class="panel">
        <div class="section__head">
          <h2 data-i18n="common.sections.tech_stack">Tech Stack</h2>
        </div>
        <div class="project-intro__chips">
          <span class="chip">C++</span>
          <span class="chip" data-i18n="8BitComputer.stack.digital_logic">Digital Logic</span>
          <span class="chip" data-i18n="8BitComputer.stack.arch_design">Architecture Design</span>
          <span class="chip" data-i18n="8BitComputer.stack.simulation">Simulation</span>
        </div>
      </article>
    </section>

    <section id="videos" class="section">
      <div class="section__head">
        <h2><span data-i18n="8BitComputer.sections.demo_videos">Demo Videos</span> (<span id="videoCount">0</span>)</h2>
      </div>
      <div class="panel">
        <p class="project-intro__desc" data-i18n="8BitComputer.videos.placeholder">
        </p>
      </div>
    </section>

    <section class="section">
      <article class="theme-photo-card">
        <img
          src="../../image/Arcueid_Bar.png"
          data-src-dark="../../image/Arcueid_Bar.png"
          data-src-light="../../image/The_Stranger_In_The_Mirror_T.png"
          alt="Theme preview card"
          data-i18n="common.theme.preview_alt"
          data-i18n-attr="alt"
          loading="lazy"
        />
      </article>
    </section>
  </main>

  <footer class="footer">
    <p><span class="mono">&copy; <span id="year"></span> Akil</span> <span class="dot">&middot;</span> <span class="mono" data-i18n="8BitComputer.footer.page">8Bit Computer Project Page</span></p>
